name: Magpie
options:
  bundleIdPrefix: com.bleak-rooster
  organizationName: bleak-rooster
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # TestFlight (T1): scripts/archive.sh passes the team and build number; neither is stored here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
configs:
  Debug: debug
  Release: release
packages:
  MagpieKit:
    path: Packages/MagpieKit
targets:
  Magpie:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: MagpieKit
        product: MagpieCore
      - package: MagpieKit
        product: NavidromeKit
      - package: MagpieKit
        product: ListenBrainzKit
      - package: MagpieKit
        product: LidarrKit
      - package: MagpieKit
        product: MatchIndex
      - package: MagpieKit
        product: Search
      - package: MagpieKit
        product: Requests
      - package: MagpieKit
        product: Playback
      - package: MagpieKit
        product: DesignSystem
      - package: MagpieKit
        product: CarPlayUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bleak-rooster.magpie
        PRODUCT_NAME: Magpie
        # CarPlay audio needs Apple's approval before any profile can carry it, so device builds sign
        # without it unless MAGPIE_CARPLAY=YES (scripts/archive.sh --carplay). The simulator always has it (B7).
        MAGPIE_CARPLAY: "NO"
        MAGPIE_ENTITLEMENTS_YES: App/Magpie.entitlements
        MAGPIE_ENTITLEMENTS_NO: App/MagpieNoCarPlay.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MAGPIE_ENTITLEMENTS_$(MAGPIE_CARPLAY))
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Magpie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # R14: the alternate icons (scripts/render-alternate-icons.swift; AppIconChoice). Settings › Appearance › App icon.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "RecordForest RecordInk RecordSunset MagpieForest MagpieInk MagpieSunset WaveForest WaveInk WaveSunset NestForest NestInk NestSunset"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # iPhone: portrait only (the screens are designed for it). iPad keeps all four: upload validation
        # rejects a multitasking iPad app without them.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # R16: "fetch" lets iOS give the requests runner a background pass now and then (BGAppRefreshTask, best-effort).
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.bleak-rooster.magpie.requests]
        NSLocalNetworkUsageDescription: Magpie connects to your music server on your home network.
        # T3 (D38): Magpie advertises and browses for its own _magpie._tcp service to ask for Local Network access.
        NSBonjourServices: ["_http._tcp", "_magpie._tcp"]
        # T2 (spec §8): plain http anywhere, in every configuration; Magpie's plain-http consent gate is the control.
        # Never add NSAllowsLocalNetworking (or the web-content/media keys): iOS would then ignore arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
    postBuildScripts:
      - name: CarPlay scene only with the CarPlay entitlement
        basedOnDependencyAnalysis: false
        script: |
          # Without com.apple.developer.carplay-audio (TestFlight before Apple's approval) don't declare a
          # CarPlay scene: the app simply isn't offered in CarPlay. Runs before code signing.
          if ! /usr/libexec/PlistBuddy -c "Print :com.apple.developer.carplay-audio" "$SRCROOT/$CODE_SIGN_ENTITLEMENTS" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
          fi
  MagpieTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/MagpieTests]
    dependencies:
      - target: Magpie
      - package: MagpieKit
        product: MagpieTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bleak-rooster.magpie.tests
        GENERATE_INFOPLIST_FILE: YES
  MagpieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/MagpieUITests]
    dependencies:
      - target: Magpie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bleak-rooster.magpie.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Magpie:
    build:
      targets:
        Magpie: all
    test:
      targets:
        - MagpieTests
        - MagpieUITests
