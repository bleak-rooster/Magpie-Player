<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appearance — Character dial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{--font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--font-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;--font-display:var(--font-text);--display-weight:700;--display-track:-0.4px;--accent:#3CC4B8;--accent-ink:#3CC4B8;--on-accent:#04201D;--r-art:8px;--r-card:20px;font-family:var(--font-text);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.ch-signature,.ch-immersive{--font-display:ui-serif,"New York","Newsreader",Georgia,serif;--display-weight:600}
.ch-classic.sc-light{--bg:#FFFFFF;--surface:#F2F2F7;--surface2:#E5E5EA;--ink:#000000;--ink2:#6C6C70;--sep:#D1D1D6;--accent-ink:#0E6F68;--glass:rgba(250,250,252,.72);--glass-line:rgba(255,255,255,.7);--shadow:0 8px 28px rgba(0,0,0,.12)}
.ch-classic.sc-dark{--bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--ink:#FFFFFF;--ink2:#98989F;--sep:#38383A;--glass:rgba(38,38,42,.66);--glass-line:rgba(255,255,255,.14);--shadow:0 8px 28px rgba(0,0,0,.5)}
.ch-signature.sc-light{--bg:#FBFAF7;--surface:#F2EFE9;--surface2:#E8E3DA;--ink:#16130F;--ink2:#6B655C;--sep:#E3DED5;--accent-ink:#0E6F68;--glass:rgba(251,250,247,.7);--glass-line:rgba(255,255,255,.75);--shadow:0 10px 30px rgba(40,25,10,.14)}
.ch-signature.sc-dark{--bg:#0E0D0C;--surface:#1A1816;--surface2:#24211E;--ink:#F4F1EA;--ink2:#A39C90;--sep:#2C2925;--glass:rgba(36,33,30,.62);--glass-line:rgba(255,255,255,.12);--shadow:0 10px 30px rgba(0,0,0,.55)}
.ch-immersive{--bg:#0B0A10;--surface:rgba(255,255,255,.10);--surface2:rgba(255,255,255,.16);--ink:#FFFFFF;--ink2:rgba(255,255,255,.72);--sep:rgba(255,255,255,.16);--glass:rgba(255,255,255,.14);--glass-line:rgba(255,255,255,.22);--shadow:0 10px 30px rgba(0,0,0,.4)}
.backdrop{display:none}
.ch-immersive .backdrop{display:block;position:absolute;inset:-60px;filter:blur(48px) saturate(1.3) brightness(.55);transform:scale(1.15);z-index:0}
.ch-immersive .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));z-index:0}
.layer{position:relative;z-index:1}
/* type */
.large-title{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);font-size:34px;line-height:41px;margin:0}
.title1{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);font-size:28px;line-height:34px;margin:0}
.title2{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:-0.2px;font-size:22px;line-height:28px;margin:0}
.title3{font-weight:600;font-size:20px;line-height:25px;margin:0}
.headline{font-weight:600;font-size:17px;line-height:22px}
.body{font-size:17px;line-height:22px}
.callout{font-size:16px;line-height:21px}
.subhead{font-size:15px;line-height:20px}
.footnote{font-size:13px;line-height:18px}
.caption{font-size:12px;line-height:16px}
.muted{color:var(--ink2)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.accent{color:var(--accent-ink)}
/* surfaces */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:0.5px solid var(--glass-line);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:var(--r-card)}
.sep{height:0.5px;background:var(--sep)}
/* art (fictional covers) */
.art{border-radius:var(--r-art);position:relative;overflow:hidden;flex:none}
.art-1{background:radial-gradient(circle at 70% 30%,#F4D58D 0 18%,transparent 19%),linear-gradient(180deg,#0F4C5C 0 58%,#E9C46A 58% 62%,#1B6F78 62%)}
.art-2{background:radial-gradient(circle at 30% 65%,#FFE8D6 0 10%,transparent 11%),radial-gradient(circle at 62% 40%,#F4A261 0 14%,transparent 15%),linear-gradient(160deg,#9B2226,#E76F51)}
.art-3{background:radial-gradient(circle at 50% 55%,#FF4D8D 0 22%,transparent 23%),repeating-linear-gradient(0deg,#2B2D42 0 10px,#24263A 10px 20px)}
.art-4{background:radial-gradient(ellipse at 50% 110%,#B7E4C7 0 35%,transparent 36%),linear-gradient(135deg,#1B4332,#40916C)}
.art-5{background:linear-gradient(0deg,#F1FAEE 0 30%,transparent 30%),radial-gradient(circle at 50% 70%,#A8DADC 0 30%,transparent 31%),linear-gradient(180deg,#1D3557,#457B9D)}
.art-6{background:repeating-linear-gradient(90deg,#FFB703 0 14%,#FB8500 14% 28%,#F2E8CF 28% 42%)}
.art-7{background:radial-gradient(circle at 30% 30%,#111 0 12%,transparent 13%),linear-gradient(45deg,transparent 48%,#111 48% 52%,transparent 52%),#EFE9DD}
.art-8{background:radial-gradient(circle at 75% 75%,#FFD166 0 16%,transparent 17%),linear-gradient(200deg,#7209B7,#F72585 60%,#FF9E00)}
.art-9{background:conic-gradient(from 200deg at 40% 60%,#264653,#2A9D8F,#E9C46A,#264653)}
.art-10{background:radial-gradient(circle at 50% 40%,#FDF0D5 0 25%,transparent 26%),linear-gradient(180deg,#C1121F,#780000)}
/* record = not in library yet (Signature/Immersive). Classic shows a dimmed square instead */
.rec{border-radius:50%}
.rec::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 2.6px)}
.rec::after{content:"";position:absolute;left:50%;top:50%;width:20%;height:20%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.ch-classic .rec{border-radius:var(--r-art);opacity:.55}
.ch-classic .rec::before,.ch-classic .rec::after{display:none}
.ch-immersive .rec::after{background:#15131A}
.spin{animation:spin 1.8s linear infinite}
.ch-classic .spin{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-1{filter:saturate(.75)}.fade-2{filter:saturate(.5)}.fade-3{filter:saturate(.25)}.fade-4{filter:saturate(.05) brightness(.9)}
/* days-left arc around a record: wrapper sets --p (0-100) */
.arc{border-radius:50%;padding:2.5px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sep) 0);flex:none}
.ch-classic .arc{background:none;padding:0}
/* hallmark (quality stamp) */
.hallmark{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.3px;padding:2px 6px;border-radius:5px;border:1px solid var(--sep);color:var(--ink2);text-transform:uppercase}
.ch-signature .hallmark,.ch-immersive .hallmark{font-family:var(--font-display);font-style:italic;text-transform:none;letter-spacing:0;font-size:12px}
.hallmark.gold{color:var(--accent-ink);border-color:currentColor}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px}
.btn-fill{background:var(--accent);color:var(--on-accent)}
.btn-tint{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
.ch-immersive .btn-tint,.sc-dark .btn-tint{color:var(--accent)}
.btn-glass{background:var(--glass);border:0.5px solid var(--glass-line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.capsule{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;font-weight:600;font-size:13px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
.sc-dark .capsule,.ch-immersive .capsule{color:var(--accent)}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:var(--ink)}
.icon-btn svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* list row */
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px}
.row .thumb{width:48px;height:48px}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-text .t1{font-size:16px;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-text .t2{font-size:13px;line-height:18px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
/* tab bar + mini player (iOS 27 Liquid Glass) */
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:62px;display:flex;gap:10px;z-index:5}
.tabs{flex:1;border-radius:999px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--ink);min-width:64px;padding:6px 0;border-radius:999px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.sc-dark .tab.on,.ch-immersive .tab.on{color:var(--accent)}
.tab-search{width:62px;height:62px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
.tab-search svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.mini{position:absolute;left:16px;right:16px;bottom:96px;height:52px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;z-index:5}
.mini .thumb{width:36px;height:36px;border-radius:8px}
.mini .rec{border-radius:50%}
/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:34px 34px 0 0;background:var(--bg);box-shadow:0 -10px 40px rgba(0,0,0,.25);z-index:8}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:7}
/* grooves ripple (fetch wait) */
.ripple{position:absolute;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:ripple 3.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.ch-classic .ripple{display:none}
@media (prefers-reduced-motion: reduce){.spin,.ripple{animation:none}}
</style>
<style>
.scroller{position:absolute;inset:0;overflow-y:auto;padding:54px 0 40px;z-index:1}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nav-title{font-size:17px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 8px;color:var(--accent-ink);font-size:17px;justify-self:start}
.sc-dark .back,.ch-immersive .back{color:var(--accent)}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gh{padding:16px 36px 6px;font-size:13px;line-height:18px;color:var(--ink2);text-transform:uppercase;letter-spacing:.2px}
.gf{padding:6px 36px 0;font-size:13px;line-height:18px;color:var(--ink2);margin:0}
.group{margin:0 16px;background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.ch-signature.sc-light .group{background:#FFFFFF;box-shadow:0 0 0 0.5px var(--sep)}
.ch-classic.sc-light .scroller{background:#F2F2F7}
.ch-classic.sc-light .group{background:#FFFFFF}
.gr{display:flex;align-items:center;gap:12px;min-height:48px;padding:7px 16px;position:relative;width:100%;text-align:left;cursor:pointer}
.gr + .gr::before{content:"";position:absolute;top:0;left:16px;right:0;height:0.5px;background:var(--sep)}
.gr-text{flex:1;min-width:0;display:flex;flex-direction:column}
.gr-t1{font-size:17px;line-height:22px}
.gr-t2{font-size:13px;line-height:17px;color:var(--ink2)}
/* character cards */
.dial{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 16px}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.ccframe{width:100%;border-radius:19px;padding:3px;box-shadow:inset 0 0 0 1px var(--sep)}
.cc.on .ccframe{background:var(--accent);box-shadow:none}
.ccv{height:146px;border-radius:16px;position:relative;overflow:hidden;box-shadow:0 0 0 0.5px rgba(0,0,0,.08)}
.ccin{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px 8px;height:100%}
.ccart{width:62px;height:62px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.ch-immersive .ccart{width:70px;height:70px;border-radius:9px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.ch-classic .ccart{box-shadow:none}
.cct{font-family:var(--font-display);font-weight:var(--display-weight);font-size:12px;line-height:15px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ch-classic .cct{font-size:11px;font-weight:600}
.ccs{font-size:10px;line-height:12px;color:var(--ink2)}
.ccbar{width:78%;height:3px;border-radius:2px;background:var(--sep);overflow:hidden;margin-top:4px}
.ccbar i{display:block;width:44%;height:100%;background:var(--ink)}
.ch-signature .ccbar i,.ch-immersive .ccbar i{background:var(--accent)}
.ccctl{display:flex;gap:12px;align-items:center;margin-top:3px;color:var(--ink)}
.ccctl svg{width:12px;height:12px;fill:currentColor}
.pt{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);z-index:1}
.ccl{font-size:14px;font-weight:600;line-height:18px}
.ccd{font-size:11px;line-height:14px;color:var(--ink2);margin-top:-4px}
.check{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg);z-index:2}
.check svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* swatches */
.sws{display:flex;gap:10px}
.swb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.swb i{width:28px;height:28px;border-radius:50%;display:block}
.swb.on{box-shadow:inset 0 0 0 2px var(--ink)}
/* switch */
.sw{position:relative;flex:none}
.sw input{position:absolute;opacity:0;width:51px;height:31px;margin:0;cursor:pointer}
.sw-track{display:block;width:51px;height:31px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s}
.ch-signature.sc-light .sw-track,.ch-classic.sc-light .sw-track{background:#E3DED5}
.ch-classic.sc-light .sw-track{background:#E5E5EA}
.sw-track::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked + .sw-track{background:var(--accent)}
.sw input:checked + .sw-track::after{transform:translateX(20px)}
.sw input:focus-visible + .sw-track{outline:2px solid var(--accent);outline-offset:2px}
/* visualizer seg */
.vseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}
.vbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:14px;font-size:13px;font-weight:600;color:var(--ink2);min-height:44px}
.vbtn.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.vbtn svg{width:30px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.vbtn.on svg{stroke:var(--accent)}
/* app icons */
.icons{display:flex;gap:22px;padding:4px 20px 0}
.aib{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:4px;border-radius:18px}
.aib.on{color:var(--ink);font-weight:600}
.aib.on .ai{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--accent)}
.ai{width:60px;height:60px;border-radius:14px;position:relative;overflow:hidden;flex:none}
.ai .r{position:absolute;width:60%;height:60%;right:8%;top:20%;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#1b1a19 0 1.3px,#2c2a28 1.3px 2.3px)}
.ai .r::after{content:"";position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:#3CC4B8;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.ai .s{position:absolute;width:56%;height:56%;left:12%;top:22%;border-radius:4px}
.ai-classic{background:linear-gradient(180deg,#FFFFFF,#ECECF1)}
.ai-classic .s{background:#3CC4B8;box-shadow:2px 0 6px rgba(0,0,0,.15)}
.ai-classic .r::after{background:#FFFFFF}
.ai-signature{background:#F4EFE6}
.ai-signature .s{background:#16130F;box-shadow:2px 0 6px rgba(0,0,0,.2)}
.ai-signature .s::after{content:"";position:absolute;left:18%;right:18%;bottom:18%;height:2px;background:#3CC4B8;border-radius:1px}
.ai-immersive{background:radial-gradient(circle at 75% 80%,#FFD166 0 14%,transparent 15%),linear-gradient(200deg,#7209B7,#F72585 60%,#FF9E00)}
.ai-immersive .s{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ai-immersive .r{box-shadow:0 0 14px rgba(255,209,102,.6)}
</style>
</helmet>
<div class="app ch-{{ch}} sc-{{sc}}" style="width:390px;height:844px;position:relative;overflow:hidden;--accent:{{accentHex}};--accent-ink:{{accentInk}};--on-accent:{{onAccent}}">
  <div class="backdrop art-3"></div>
  <div class="scrim"></div>

  <div class="scroller">
    <div class="nav">
      <a class="back" href="Settings.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Settings</a>
      <span class="nav-title">Appearance</span>
      <span></span>
    </div>

    <div class="gh">Character</div>
    <div class="dial" role="radiogroup" aria-label="Character">
      <button class="cc {{clsC}}" onClick="{{pickClassic}}" role="radio" aria-checked="{{isC}}">
        <div class="ccframe">
          <div class="app ch-classic sc-{{pvSc}} ccv" style="--accent:{{accentHex}}">
            <div class="ccin">
              <div class="art art-3 ccart"></div>
              <div class="cct">Last Stop Lullaby</div>
              <div class="ccs">Ada Okafor</div>
              <div class="ccbar"><i></i></div>
              <div class="ccctl" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path transform="scale(-1,1) translate(-24,0)" d="M3 5.5v13l9-6.5zM12 5.5v13l9-6.5z"/></svg>
                <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.2"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2"/></svg>
                <svg viewBox="0 0 24 24"><path d="M3 5.5v13l9-6.5zM12 5.5v13l9-6.5z"/></svg>
              </div>
            </div>
          </div>
        </div>
        <sc-if value="{{isC}}" hint-placeholder-val="{{ false }}"><span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></sc-if>
        <span class="ccl">Classic</span>
        <span class="ccd">Stock and simple</span>
      </button>

      <button class="cc {{clsS}}" onClick="{{pickSignature}}" role="radio" aria-checked="{{isS}}">
        <div class="ccframe">
          <div class="app ch-signature sc-{{pvSc}} ccv" style="--accent:{{accentHex}}">
            <div class="ccin">
              <div class="art art-3 ccart"></div>
              <div class="cct">Last Stop Lullaby</div>
              <div class="ccs">Ada Okafor</div>
              <div class="ccbar"><i></i></div>
              <div class="ccctl" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path transform="scale(-1,1) translate(-24,0)" d="M3 5.5v13l9-6.5zM12 5.5v13l9-6.5z"/></svg>
                <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.2"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2"/></svg>
                <svg viewBox="0 0 24 24"><path d="M3 5.5v13l9-6.5zM12 5.5v13l9-6.5z"/></svg>
              </div>
            </div>
          </div>
        </div>
        <sc-if value="{{isS}}" hint-placeholder-val="{{ true }}"><span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></sc-if>
        <span class="ccl">Signature</span>
        <span class="ccd">Our own voice</span>
      </button>

      <button class="cc {{clsI}}" onClick="{{pickImmersive}}" role="radio" aria-checked="{{isI}}">
        <div class="ccframe">
          <div class="app ch-immersive sc-dark ccv" style="--accent:{{accentHex}}">
            <div class="backdrop art-3" style="inset:-30px;filter:blur(18px) saturate(1.4) brightness(.6)"></div>
            <span class="pt" style="width:3px;height:3px;left:14%;top:22%"></span>
            <span class="pt" style="width:2px;height:2px;left:80%;top:14%"></span>
            <span class="pt" style="width:4px;height:4px;left:86%;top:58%;opacity:.5"></span>
            <span class="pt" style="width:2px;height:2px;left:10%;top:70%"></span>
            <div class="ccin">
              <div class="art art-3 ccart"></div>
              <div class="cct">Last Stop Lullaby</div>
              <div class="ccs">Ada Okafor</div>
              <div class="ccbar"><i></i></div>
            </div>
          </div>
        </div>
        <sc-if value="{{isI}}" hint-placeholder-val="{{ false }}"><span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></sc-if>
        <span class="ccl">Immersive</span>
        <span class="ccd">Art takes over</span>
      </button>
    </div>

    <div class="gh">Colour &amp; motion</div>
    <div class="group">
      <div class="gr" style="cursor:default">
        <div class="gr-text"><span class="gr-t1">Accent</span><span class="gr-t2">{{accentName}}</span></div>
        <div class="sws" role="radiogroup" aria-label="Accent colour">
          <button class="swb {{clsT}}" onClick="{{pickTangerine}}" role="radio" aria-checked="{{isT}}" aria-label="Sheen"><i style="background:#3CC4B8"></i></button>
          <button class="swb {{clsU}}" onClick="{{pickUltramarine}}" role="radio" aria-checked="{{isU}}" aria-label="Ultramarine"><i style="background:#3D5AFE"></i></button>
          <button class="swb {{clsM}}" onClick="{{pickMint}}" role="radio" aria-checked="{{isM}}" aria-label="Tangerine"><i style="background:#F25C05"></i></button>
        </div>
      </div>
      <label class="gr">
        <span class="gr-text"><span class="gr-t1">Sleeve tint</span><span class="gr-t2">Colour pages from their artwork</span></span>
        <span class="sw"><input type="checkbox" checked="{{tint}}" onChange="{{toggleTint}}"><span class="sw-track"></span></span>
      </label>
      <label class="gr">
        <span class="gr-text"><span class="gr-t1">Spin records while bringing music home</span></span>
        <span class="sw"><input type="checkbox" checked="{{spinOn}}" onChange="{{toggleSpin}}"><span class="sw-track"></span></span>
      </label>
    </div>
    <sc-if value="{{reduceMotion}}" hint-placeholder-val="{{ true }}">
      <p class="gf">Reduce Motion is on: spins and particles pause.</p>
    </sc-if>

    <div class="gh">Immersive visualizer</div>
    <div class="group">
      <div class="vseg" role="radiogroup" aria-label="Visualizer style">
        <button class="vbtn {{clsHalo}}" onClick="{{pickHalo}}" role="radio" aria-checked="{{isHalo}}">
          <svg viewBox="0 0 30 22" aria-hidden="true"><circle cx="15" cy="11" r="4"/><circle cx="15" cy="11" r="7.5" opacity=".6"/><circle cx="15" cy="11" r="10.5" opacity=".3"/></svg>Halo</button>
        <button class="vbtn {{clsBars}}" onClick="{{pickBars}}" role="radio" aria-checked="{{isBars}}">
          <svg viewBox="0 0 30 22" aria-hidden="true"><path d="M5 14v4M10 8v10M15 4v14M20 10v8M25 13v5"/></svg>Bars</button>
        <button class="vbtn {{clsDust}}" onClick="{{pickDust}}" role="radio" aria-checked="{{isDust}}">
          <svg viewBox="0 0 30 22" aria-hidden="true"><circle cx="6" cy="15" r="1"/><circle cx="11" cy="7" r="1.4"/><circle cx="16" cy="13" r="1"/><circle cx="21" cy="5" r="1.2"/><circle cx="24" cy="16" r="1.5"/><circle cx="14" cy="19" r=".8"/></svg>Particles</button>
      </div>
    </div>
    <p class="gf">{{visNote}}</p>

    <div class="gh">App icon</div>
    <div class="icons" role="radiogroup" aria-label="App icon">
      <button class="aib {{clsIcC}}" onClick="{{iconClassic}}" role="radio" aria-checked="{{icC}}"><span class="ai ai-classic" aria-hidden="true"><span class="r"></span><span class="s"></span></span>Classic</button>
      <button class="aib {{clsIcS}}" onClick="{{iconSignature}}" role="radio" aria-checked="{{icS}}"><span class="ai ai-signature" aria-hidden="true"><span class="r"></span><span class="s"></span></span>Signature</button>
      <button class="aib {{clsIcI}}" onClick="{{iconImmersive}}" role="radio" aria-checked="{{icI}}"><span class="ai ai-immersive" aria-hidden="true"><span class="r"></span><span class="s"></span></span>Immersive</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"character":{"editor":"enum","options":["classic","signature","immersive"],"default":"signature","section":"Look"},"scheme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Look"},"reduceMotion":{"editor":"boolean","default":true,"section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const ch = s.pick || (this.props.character ?? 'signature');
    const sc = ch === 'immersive' ? 'dark' : (this.props.scheme ?? 'light');
    const accent = s.accent || 'sheen';
    const A = {
      sheen: { hex: '#3CC4B8', inkLight: '#0E6F68', on: '#04201D', name: 'Sheen' },
      ultramarine: { hex: '#3D5AFE', inkLight: '#2A44D8', on: '#FFFFFF', name: 'Ultramarine' },
      tangerine: { hex: '#F25C05', inkLight: '#00775E', on: '#00140E', name: 'Tangerine' }
    }[accent];
    const vis = s.vis || 'halo';
    const icon = s.icon || 'signature';
    const tint = s.tint === undefined ? true : s.tint;
    const spinOn = s.spin === undefined ? true : s.spin;
    const set = (k, v) => () => this.setState({ [k]: v });
    return {
      ch, sc, pvSc: sc,
      isClassic: ch === 'classic', isImmersive: ch === 'immersive', notClassic: ch !== 'classic',
      isC: ch === 'classic', isS: ch === 'signature', isI: ch === 'immersive',
      clsC: ch === 'classic' ? 'on' : '', clsS: ch === 'signature' ? 'on' : '', clsI: ch === 'immersive' ? 'on' : '',
      pickClassic: set('pick', 'classic'), pickSignature: set('pick', 'signature'), pickImmersive: set('pick', 'immersive'),
      accentHex: A.hex, accentInk: sc === 'light' ? A.inkLight : A.hex, onAccent: A.on, accentName: A.name,
      isT: accent === 'sheen', isU: accent === 'ultramarine', isM: accent === 'tangerine',
      clsT: accent === 'sheen' ? 'on' : '', clsU: accent === 'ultramarine' ? 'on' : '', clsM: accent === 'tangerine' ? 'on' : '',
      pickTangerine: set('accent', 'sheen'), pickUltramarine: set('accent', 'ultramarine'), pickMint: set('accent', 'tangerine'),
      tint, spinOn,
      toggleTint: () => this.setState({ tint: !tint }),
      toggleSpin: () => this.setState({ spin: !spinOn }),
      reduceMotion: this.props.reduceMotion ?? true,
      isHalo: vis === 'halo', isBars: vis === 'bars', isDust: vis === 'dust',
      clsHalo: vis === 'halo' ? 'on' : '', clsBars: vis === 'bars' ? 'on' : '', clsDust: vis === 'dust' ? 'on' : '',
      pickHalo: set('vis', 'halo'), pickBars: set('vis', 'bars'), pickDust: set('vis', 'dust'),
      visNote: ch === 'immersive' ? 'Plays behind Now Playing. Pauses in Low Power Mode.' : 'Shows on Now Playing when Character is Immersive.',
      icC: icon === 'classic', icS: icon === 'signature', icI: icon === 'immersive',
      clsIcC: icon === 'classic' ? 'on' : '', clsIcS: icon === 'signature' ? 'on' : '', clsIcI: icon === 'immersive' ? 'on' : '',
      iconClassic: set('icon', 'classic'), iconSignature: set('icon', 'signature'), iconImmersive: set('icon', 'immersive')
    };
  }
}
</script>
</body>
</html>
